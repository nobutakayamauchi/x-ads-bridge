name: Funnel Audit Bridge

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: funnel-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[funnel]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Execute funnel audit command
        id: bridge
        continue-on-error: true
        env:
          FUNNEL_API_BASE_URL: ${{ secrets.FUNNEL_API_BASE_URL }}
          FUNNEL_AUDIT_TOKEN: ${{ secrets.FUNNEL_AUDIT_TOKEN }}
        run: python funnel_issue_runner.py

      - name: Post result to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file result.md

      - name: Mark workflow failed when bridge failed
        if: steps.bridge.outcome == 'failure'
        run: exit 1
