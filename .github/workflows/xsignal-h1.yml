name: X Signal H1 Search

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: xsignal-h1-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  search:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[xsignal] H1')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bounded H1 search
        id: signal
        continue-on-error: true
        env:
          XADS_CONSUMER_KEY: ${{ secrets.XADS_CONSUMER_KEY }}
          XADS_CONSUMER_SECRET: ${{ secrets.XADS_CONSUMER_SECRET }}
          XADS_ACCESS_TOKEN: ${{ secrets.XADS_ACCESS_TOKEN }}
          XADS_ACCESS_TOKEN_SECRET: ${{ secrets.XADS_ACCESS_TOKEN_SECRET }}
          X_SIGNAL_ALLOW_PAID_READS: 'true'
          X_SIGNAL_MAX_COST_USD_PER_RUN: '0.10'
        run: python signal_issue_runner.py

      - name: Store evidence record
        if: steps.signal.outcome == 'success' && hashFiles('result.json') != ''
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p evidence/h1
          cp result.json "evidence/h1/issue-${ISSUE_NUMBER}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "evidence/h1/issue-${ISSUE_NUMBER}.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Store H1 X signal evidence from issue #${ISSUE_NUMBER}"
          git push origin HEAD:main

      - name: Post result to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f result.md ]; then
            printf '## H1 purposeful X search failed\n\nNo result file was produced.\n' > result.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file result.md

      - name: Mark workflow failed when search failed
        if: steps.signal.outcome == 'failure'
        run: exit 1
